[build-system]  # 告诉打包工具怎么构建包
requires = ["setuptools>=68"]  # 构建阶段需要的包（不是运行依赖）
build-backend = "setuptools.build_meta"  # 构建后端

[project]  # 这部分是 pip、PyPI 读取的标准信息
name = "myagent"
version = "0.1.0"
description = "Extensible local coding agent"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49,<1",
  "openai>=1,<2",
  "python-dotenv>=1,<2",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]  # 可选依赖组
dev = ["pytest>=8,<9"]

[project.scripts]  # CLI 命令入口
myagent = "myagent.cli.repl:main"

[tool.pytest.ini_options]  # pytest 的配置
testpaths = ["tests"]
pythonpath = ["."]
