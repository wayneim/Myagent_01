[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "0.1.0"
description = "Extensible local coding agent"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
myagent = "myagent.cli.repl:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
